<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B1220">
    <title>Offline - Dublin Muay Thai Gym Finder</title>
    <!-- Inline styles only: this page must work with no network, so it can't depend on a CDN -->
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
               background: #0F172A; color: #E2E8F0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 28rem; text-align: center; }
        .icon { font-size: 3.5rem; }
        h1 { margin: .5rem 0; font-size: 1.6rem; }
        p { color: #94A3B8; line-height: 1.5; }
        button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: .4rem;
                 background: #F59E0B; color: #0F172A; font-weight: 600; font-size: 1rem; cursor: pointer; }
        button:focus-visible { outline: 3px solid #FBBF24; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">📡</div>
        <h1>You're offline</h1>
        <p>This page hasn't been saved on your device yet. Pages and gyms you've already viewed
           will still open. Reconnect to load anything new.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
